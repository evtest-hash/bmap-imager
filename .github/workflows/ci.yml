name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # ---- Qt ----
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          cache: true

      # ---- dependencies ----
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libarchive-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install qt libarchive

      # libarchive (Windows) is installed automatically via vcpkg manifest mode
      # (see vcpkg.json) during the Configure step, with default features
      # disabled to avoid building openssl/libxml2 from source.

      # ---- configure ----
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix libarchive)"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ---- build + test ----
      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # ---- UI screenshot ----
      # Renders the main window headlessly on each platform and uploads it, so
      # UI changes can be reviewed without a local Qt install. The offscreen
      # platform plugin needs no display server, and since the app forces the
      # Fusion style the render matches what a real desktop would show.
      - name: Render UI screenshot (Unix)
        if: runner.os != 'Windows'
        run: ./build/src/ui/bmapimager -platform offscreen --screenshot "ui-${{ runner.os }}.png"

      - name: Render UI screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build/src/ui/Release/bmapimager.exe"
          if (-not (Test-Path $exe)) { $exe = "build/src/ui/bmapimager.exe" }
          & $exe -platform offscreen --screenshot "ui-Windows.png"
          if ($LASTEXITCODE -ne 0) { throw "screenshot failed ($LASTEXITCODE)" }

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ runner.os }}
          path: ui-*.png
          if-no-files-found: error

      # ---- macOS .app (local-confirmation artifact, not a release) ----
      - name: Assemble macOS .app
        if: runner.os == 'macOS'
        run: |
          APP="build/BmapImager.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/src/ui/bmapimager        "$APP/Contents/MacOS/BmapImager"
          cp build/src/writer/bmap-writer   "$APP/Contents/MacOS/bmap-writer"
          cp packaging/macOS/Info.plist     "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          # Bundle the Qt runtime + Cocoa platform plugin so the app runs on a
          # machine without Qt installed.
          macdeployqt "$APP" -verbose=1
          # Ad-hoc sign (best-effort) so it launches locally without Gatekeeper.
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          (cd build && zip -qr ../BmapImager-macOS.zip BmapImager.app)
          ls -lh BmapImager-macOS.zip

      - name: Upload macOS .app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BmapImager-macOS
          path: BmapImager-macOS.zip
