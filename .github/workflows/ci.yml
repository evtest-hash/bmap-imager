name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # ---- Qt ----
      # Windows and macOS use the official Qt binaries rather than a package
      # manager. Homebrew bottles are built for the runner's own OS, so a
      # brew Qt from a macos-26 runner produces frameworks with minos 26 that
      # will not load on any older Mac. The official builds target macOS 12.
      # 6.8 LTS, not 6.6: Qt 6.6's CMake config still lists the AGL framework,
      # which current macOS SDKs no longer ship, so linking fails on the
      # runner. 6.8 dropped that dependency and still targets macOS 12.
      - name: Install Qt (Windows / macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # ---- dependencies ----
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libarchive-dev

      # libarchive comes from vcpkg on both Windows and macOS (manifest mode,
      # see vcpkg.json) with default features disabled, to avoid building
      # openssl/libxml2 from source. macOS additionally pins the deployment
      # target and static linkage via packaging/vcpkg-triplets.
      - name: Set up vcpkg (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -n "$VCPKG_INSTALLATION_ROOT" ] && [ -d "$VCPKG_INSTALLATION_ROOT" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi

      # ---- configure ----
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Without an explicit deployment target CMake stamps the build host's
      # OS version onto the binaries, so a macos-26 runner produced an app
      # that demanded macOS 26.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=arm64-osx-12
          -DVCPKG_OVERLAY_TRIPLETS=packaging/vcpkg-triplets

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ---- build + test ----
      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # ---- UI screenshot ----
      # Renders the main window headlessly on each platform and uploads it, so
      # UI changes can be reviewed without a local Qt install. The offscreen
      # platform plugin needs no display server, and since the app forces the
      # Fusion style the render matches what a real desktop would show.
      - name: Render UI screenshot (Unix)
        if: runner.os != 'Windows'
        run: ./build/src/ui/bmapimager -platform offscreen --screenshot "ui-${{ runner.os }}.png"

      - name: Render UI screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build/src/ui/Release/bmapimager.exe"
          if (-not (Test-Path $exe)) { $exe = "build/src/ui/bmapimager.exe" }
          # Use the real windows plugin: the offscreen one has no font database
          # on Windows and renders every glyph as .notdef. Fall back to
          # offscreen (pointed at the system fonts) if there is no desktop.
          & $exe --screenshot "ui-Windows.png"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "windows plugin failed ($LASTEXITCODE); retrying offscreen"
            $env:QT_QPA_FONTDIR = "C:\Windows\Fonts"
            & $exe -platform offscreen --screenshot "ui-Windows.png"
            if ($LASTEXITCODE -ne 0) { throw "screenshot failed ($LASTEXITCODE)" }
          }

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ runner.os }}
          path: ui-*.png
          if-no-files-found: error

      # ---- macOS .app (local-confirmation artifact, not a release) ----
      - name: Assemble macOS .app
        if: runner.os == 'macOS'
        run: |
          APP="build/BmapImager.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/src/ui/bmapimager        "$APP/Contents/MacOS/BmapImager"
          cp build/src/writer/bmap-writer   "$APP/Contents/MacOS/bmap-writer"
          cp packaging/macOS/Info.plist     "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          # Bundle the Qt runtime + Cocoa platform plugin so the app runs on a
          # machine without Qt installed. bmap-writer must be named explicitly:
          # macdeployqt only rewrites the bundle's main executable, so without
          # this the privileged helper keeps pointing at the runner's own
          # /opt/homebrew paths and dies the moment a flash starts.
          macdeployqt "$APP" -verbose=1 -executable="$APP/Contents/MacOS/bmap-writer"
          # Ad-hoc sign (best-effort) so it launches locally without Gatekeeper.
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          (cd build && zip -qr ../BmapImager-macOS.zip BmapImager.app)
          ls -lh BmapImager-macOS.zip

      # A green build never meant the bundle could actually load: it was only
      # ever run against the runner's own Qt. Check both binaries resolve
      # entirely inside the bundle, and that the app really starts.
      - name: Smoke-test the .app
        if: runner.os == 'macOS'
        run: |
          APP="build/BmapImager.app"
          fail=0
          for bin in BmapImager bmap-writer; do
            leaked=$(otool -L "$APP/Contents/MacOS/$bin" \
              | tail -n +2 | awk '{print $1}' \
              | grep -E '^/(opt|usr/local)/' || true)
            if [ -n "$leaked" ]; then
              echo "::error::$bin references paths outside the bundle:"
              echo "$leaked"
              fail=1
            fi
            echo "-- $bin minos: $(otool -l "$APP/Contents/MacOS/$bin" \
              | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
          done
          [ "$fail" -eq 0 ] || exit 1
          # Actually load it: this is what catches a bundle that cannot start.
          "$APP/Contents/MacOS/BmapImager" -platform offscreen --screenshot /tmp/app-smoke.png
          test -s /tmp/app-smoke.png
          echo "bundle launches and renders"

      - name: Upload macOS .app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BmapImager-macOS
          path: BmapImager-macOS.zip
