name: bmap macOS

# First goal on this branch: prove the upstream tree builds with a stock Qt,
# before changing any of it. Upstream's own macOS path builds Qt from source
# (qt/build-qt-macos.sh); CONTRIBUTING.md says any Qt 6 satisfying the
# find_package(Qt6 6.9) minimum in src/CMakeLists.txt will also configure, so
# this uses the official 6.9.3 build instead. The vendored third-party trees
# are left uninitialised on purpose: src/dependencies/fetch-vendor.cmake falls
# back to FetchContent when a vendor tree is missing.

on:
  push:
    branches: [bmap-on-rpi]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          modules: 'qt5compat qtimageformats qtshadertools'
          cache: true

      - name: Install build tools
        run: brew install ninja

      # The FetchContent trees (curl, libarchive, zstd, xz, zlib, nghttp2,
      # libusb) are all built from source, so cache them across runs.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('src/dependencies/**') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -B build -G Ninja src
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build

      # Upstream already runs macdeployqt as a POST_BUILD step (with -qmldir, so
      # the QML import plugins come along), so the bundle should be
      # self-contained. Prove it rather than assume it: a green build says
      # nothing about whether the artifact loads on another machine.
      - name: Smoke-test the .app
        run: |
          APP=build/rpi-imager.app
          BIN="$APP/Contents/MacOS/rpi-imager"
          test -x "$BIN"

          echo "--- deployment target ---"
          otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print "minos", $2; exit}'

          echo "--- references outside the bundle ---"
          leaked=$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' \
                   | grep -E '^/(opt|usr/local)/' || true)
          if [ -n "$leaked" ]; then
            echo "::error::binary references paths outside the bundle:"
            echo "$leaked"
            exit 1
          fi
          echo "none"

          echo "--- does it actually load? ---"
          # --cli --version exits immediately, which is enough to prove every
          # framework resolves; it does not exercise the QML plugins.
          "$BIN" --cli --version

      - name: Sign and package
        run: |
          APP=build/rpi-imager.app
          # Ad-hoc signature so it launches locally without a developer ID.
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          (cd build && zip -qr ../rpi-imager-macOS.zip rpi-imager.app)
          ls -lh rpi-imager-macOS.zip

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: rpi-imager-macOS
          path: rpi-imager-macOS.zip
          if-no-files-found: error
